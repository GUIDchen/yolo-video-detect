name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      YOLO_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt ruff httpx   # httpx 供 FastAPI TestClient（面板用例）使用
      - name: 拉取权重与样例图（CI 上 GitHub 可达）
        run: |
          mkdir -p weights data
          curl -fL -o weights/yolo11n.pt https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt
          curl -fL -o data/bus.jpg https://raw.githubusercontent.com/ultralytics/ultralytics/main/ultralytics/assets/bus.jpg
      - name: 代码检查
        run: ruff check yolo_app tests scripts
      - name: 自检
        run: python -m yolo_app check
      - name: 单元测试
        run: python -m unittest discover -s tests -v
      - name: 端到端（合成视频）
        run: |
          python scripts/make_test_video.py --out data/test.mp4 --seconds 1
          python -m yolo_app run --source data/test.mp4 --max-frames 5 --out-dir /tmp/out
