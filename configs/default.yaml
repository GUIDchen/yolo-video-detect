# 复制一份改改即可，例如 configs/production.yaml，然后 --config configs/production.yaml
model:
  weights: yolo11n.pt      # 也可写 best.pt / best.onnx / best.engine，自动在 weights/ 下找
  imgsz: 640               # 320 更快、1280 更准
  conf: 0.25
  iou: 0.45
  device: null             # null=自动, cpu, 0, 0,1
  half: false              # FP16，仅 CUDA
  augment: false           # TTA 测试时增强：更准但约 2 倍耗时
  classes: []              # 例: [0] 只检测人; [person, bus] 也支持
  report_conf: 0           # 双阈值：低于该值的框只送跟踪，不进统计/绘制/抓拍；0 = 沿用 conf

track:
  enable: false            # true = ByteTrack，输出 track_id 与唯一目标数
  tracker: bytetrack.yaml  # 也可选 botsort.yaml

run:
  stride: 1                # 跳帧，2 = 每两帧推理一次
  max_frames: 0            # 0 = 全部
  reconnect: 3             # 摄像头/RTSP 掉线重连次数
  retry_delay: 1.0         # 重连间隔秒
  show: false              # 实时预览窗口
  workers: 1               # 目录批量时的并行进程数
  reader: auto             # auto | opencv | ffmpeg；auto = 直播源走 ffmpeg 子进程（低延迟 + 看门狗），其余 opencv
  read_timeout: 10         # 直播源多久没收到帧判定僵死并重启（秒）

camera:
  index: 0                 # 摄像头编号
  width: 1280
  height: 720
  fps: 30
  show: true               # camera 子命令默认弹实时窗口
  record: false            # 是否保存录像
  buffer_size: 1           # 直播源采集缓冲：1 = 只留最新帧，别让旧帧堆成延迟


analytics:
  roi: []                  # ROI 多边形，如 [[100,100],[500,100],[500,400],[100,400]]，只统计区域内目标
  line: []                 # 越线计数线，如 [[0,300],[640,300]]（需配合 --track）
  classes: []              # 参与越线计数的类别；空 = 全部
  track_ttl: 300           # 越线计数里 track 状态保留帧数，超时淘汰（长视频防内存增长）；0 = 不淘汰
  min_cross_frames: 2      # 越线防抖：连续 N 帧在新侧才计一次；1 = 单帧即判定（易被抖动刷计数）
  stationary_frames: 0     # 静止降频：连续 N 帧几乎不动则抽帧推理；0 = 关闭（需开 --track）
  stationary_interval: 10  # 静止状态下每多少帧推理一次
  stationary_min_move: 2   # 位移小于该像素数视为没动
  roi_crop: false          # 只裁 ROI 区域做推理（目标都在 ROI 内时更快更准；需先设 roi）
  roi_margin: 0.1          # 裁剪外扩比例，避免目标压在边界被切断
  roi_imgsz: 0             # 裁剪推理的输入尺寸；0 = 沿用 model.imgsz

motion:                   # 运动门控：先用帧差筛一遍，没动就不推理（单机 CPU 最划算的优化）
  enable: false           # 默认关闭；静态场景多时打开可省 60%+ 算力
  threshold: 25           # 帧差阈值
  min_area_ratio: 0.002   # 运动面积占比达到该值才算有运动
  blur: 5                 # 高斯模糊核（压噪点），<=1 关闭
  mask_roi: true          # 有 ROI 时只看 ROI 内的运动
  hold_frames: 0          # 无运动时沿用上一帧框显示多少帧

alert:
  webhook: ''              # 企业微信/飞书机器人 key，或任意接收 JSON 的 URL
  type: generic            # generic | wecom | feishu
  timeout: 5
  dedupe_s: 3.0            # 相同告警文本的静默窗口（秒），0 = 不去重
  retry:                   # 告警 outbox：失败按指数退避重试
    max_attempts: 3        # 最多尝试次数，超限置 dead（不删除，可人工排查）
    base_delay: 2.0        # 首次重试间隔秒；第 n 次失败后等待 base*2^(n-1)

output:
  dir: outputs             # 结果目录
  video: true              # 写结果视频（H.264 优先）
  name: ''                 # 空 = 按源自动命名
  json: true               # 写统计 JSON
  segment_seconds: 0       # >0 按秒数切分录像（长时录制用）
  keep_days: 0             # >0 自动清理超过 N 天的输出
  max_files: 0             # >0 只保留最近 N 个输出文件
  events:                  # 告警抓拍 + 事件落库
    enable: true
    classes: [0]           # 触发抓拍的类别（默认人）
    min_conf: 0.6
    cooldown_s: 2.0        # 同一告警冷却时间
    db: events.db          # SQLite 事件库，相对 output.dir；'' = 不落库（退回旧行为）
    async_write: true      # 抓拍图后台写盘，慢磁盘不拖慢检测
    async_queue: 64        # 异步写盘队列长度；满时丢最旧并计入 dropped_images

serve:                     # Web 面板
  host: 127.0.0.1
  port: 8000
  source: '0'              # 视频文件 / 目录 / RTSP / 摄像头编号
  quality: 80              # MJPEG 质量
  token: ''                # 非空时 /stats /metrics /stream /ws 需带 ?token=xxx；对外暴露时务必设置

metrics:
  file: ''                 # 非空则把 Prometheus 指标同时写到该文件

log:
  level: INFO
  interval: 30             # 每多少帧打一条进度日志
